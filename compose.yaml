services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked in at build time. Leave empty for root-domain hosting.
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    image: azeez-portfolio:latest
    container_name: azeez-portfolio
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
